# Dev 5 -- system health watchdog table (architecture.md §12, dev.md Dev 5 task 2).
# Any trip here is Level 2 in the 4-tier arbiter -> hold (zero /cmd_vel),
# independent of E-stop (Level 1, its own topic) and of whether the upstream
# node is honestly reporting failure or has simply gone silent.
timeouts_s:
  camera: 0.5           # /camera/image_raw heartbeat (Dev 5's own driver)
  perception_mask: 0.5  # /ugv/perception_degraded arrival heartbeat (Dev 1)
  pose_tf: 0.5           # /ugv/pose_valid arrival heartbeat (Dev 2)
  nav2_heartbeat: 0.5     # /cmd_vel_nav2 arrival heartbeat (Dev 4)
