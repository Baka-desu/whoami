# rtabmap_sync/rgbd_sync — camera RGB + DA3 depth + CameraInfo → one rtabmap_msgs/RGBDImage.
# Dev 1 stamps depth with the SOURCE image stamp (interfaces.md "Depth input"), so exact sync is
# correct; approx sync would silently pair depth with the wrong frame.
# RGB arrives at camera rate, depth only at DA3 rate and DA3-latency later: the queue must hold
# at least ~1 s of camera frames or pairs are lost. Names verified on rtabmap_ros 0.23.7 / Lyrical.
/**:
  ros__parameters:
    approx_sync: false
    sync_queue_size: 30         # ≥ camera fps × DA3 latency (s), with margin
    topic_queue_size: 10
    # `qos` also sets the QoS of the published rgbd_image, which rgbd_odometry and rtabmap subscribe RELIABLE
    # (a reliable subscriber never connects to a best-effort publisher). 0 = system default: a best-effort
    # subscriber on the inputs (connects to BOTH reliable and best-effort camera drivers / bridges) and a
    # reliable publisher for rgbd_image.
    qos: 0                      # 0 = system default, 1 = reliable, 2 = best effort
    qos_camera_info: 2          # needs CameraInfo per frame with the image stamp (not latched once)
