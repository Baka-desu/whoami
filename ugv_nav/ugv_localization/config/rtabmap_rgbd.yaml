# RTAB-Map SLAM — mono camera RGB + Depth Anything 3 Metric depth from Dev 1 (mindmap D7, D8),
# odometry from odom_selector (/odom: wheel | visual | auto, mindmap D5b).
# Input is one synced rtabmap_msgs/RGBDImage from rtabmap_sync/rgbd_sync (config/rgbd_sync.yaml).
# Mode params (Mem/IncrementalMemory, Mem/InitWMWithAllNodes) are NOT here: they come from
# ugv_localization.modes.plan_mode (single source of truth), passed by localization.launch.py.
# subscribe_odom_info is set by the launch (true only for odom_source:=visual).
#
# Parameter NAMES verified against rtabmap_ros 0.23.7 / Lyrical (2026-09-28: `rtabmap --params` for
# library params, `ros2 param list` on a live node for node params). VALUES are untuned until the
# Dev 5 sim camera + DA3 depth run. Re-check after any rtabmap upgrade (docs/localization/README.md).
# Library params (Group/Name) MUST be quoted strings (rtabmap_ros declares them as strings).
/**:
  ros__parameters:
    # ---- ROS node params ------------------------------------------------------------
    frame_id: base_link
    map_frame_id: map
    publish_tf: true            # map->odom (Dev 2 owns the whole chain, mindmap D6)
    tf_delay: 0.05              # 20 Hz map->odom  (contract: >= 15 Hz)
    tf_tolerance: 0.1
    wait_for_transform: 0.2
    subscribe_rgbd: true        # rgbd_sync output: RGB + DA3 depth + CameraInfo, exact stamps
    subscribe_rgb: false
    subscribe_depth: false
    subscribe_stereo: false
    subscribe_scan: false
    subscribe_odom: true        # /odom from odom_selector
    approx_sync: true           # rgbd_image (depth rate) vs /odom (wheel rate) stamps differ
    sync_queue_size: 30
    # rgbd_image is ~2.1 MB per message at 640x480; best effort drops most of them in transport (see
    # rgbd_odometry.yaml, docs/mapping/baseline.md "Task 23"). Reliable input, short reader queue so a busy
    # SLAM step skips old frames rather than replaying a backlog. rgbd_sync must publish RELIABLE (its `qos`).
    # topic_queue_size is the reader queue of every rtabmap subscription, so /odom (and /odom_info when subscribed) get depth 2
    # too. Kept: with wheel odometry at 30 Hz (frames 4 Hz) /rtabmap/info stayed at 1.75-1.87 Hz (1.72-1.87 Hz at 4 Hz) and each
    # node's pose matched the true pose at its image stamp (docs/mapping/baseline.md "Review fixes for 0c5f1d9").
    qos: 1                      # 0 = system default (best effort for a subscriber), 1 = reliable, 2 = best effort
    topic_queue_size: 2

    # 3D map outputs for the web viewer and the elevation mapper (docs/superpowers/plans/2026-10-02-3d-mapping-elevation.md):
    # /rtabmap/cloud_map, /rtabmap/mapPath, /rtabmap/mapGraph, /rtabmap/mapData. rtabmap only assembles them while someone
    # subscribes. Values are the 0.23.7 defaults (checked with `ros2 param get`), pinned so an upgrade cannot change them.
    # This file is also map_assembler's (/rtabmap/assembler): it serves /rtabmap/cloud_map from mapData with these same
    # Grid/* and map params, outside the SLAM step; rtabmap's own copy is remapped away (localization.launch.py).
    cloud_output_voxelized: true       # cloud_map voxelised at Grid/CellSize, not one point per depth pixel
    cloud_subtract_filtering: false    # keep every node's points (true removes points the earlier nodes already cover)
    map_always_update: false           # no map rebuild while the graph is unchanged (robot parked)
    latch: true                        # cloud_map, mapGraph and /map are TRANSIENT_LOCAL: a late subscriber gets the last one

    # ---- RTAB-Map library params (strings) ------------------------------------------
    Reg/Strategy: "0"               # visual registration
    Reg/Force3DoF: "true"           # ground robot: x, y, yaw only
    Kp/DetectorStrategy: "8"        # GFTT/ORB (BRIEF needs OpenCV xfeatures2d: absent in the Lyrical binary)
    Vis/FeatureType: "8"            # GFTT/ORB for transform estimation
    Kp/MaxFeatures: "500"
    Vis/MaxFeatures: "1000"
    Vis/MinInliers: "20"
    Vis/EstimationType: "1"         # 3D->2D PnP; 3D words come from DA3 depth
    Vis/MinDepth: "0.3"             # m
    Vis/MaxDepth: "8.0"             # m — DA3 metric error grows with range; tune from depth_report
    Kp/MaxDepth: "8.0"              # same cap for loop-closure vocabulary words
    Rtabmap/DetectionRate: "2"      # Hz; pose_validity slam_max_age_s must exceed 1/rate
    RGBD/LinearUpdate: "0.1"        # m between graph nodes
    RGBD/AngularUpdate: "0.1"       # rad between graph nodes
    RGBD/ProximityBySpace: "true"   # local loop closures
    RGBD/NeighborLinkRefining: "true"  # refine odom links visually (needs depth; tune in sim)
    RGBD/OptimizeMaxError: "3.0"    # reject loop closures that tear the graph
    # Optimizer/Strategy: build default (GTSAM in the Lyrical 0.23.7 binary).

    # Occupancy grid /map from DA3 depth (optional for Dev 3; not a Nav2 requirement).
    Grid/Sensor: "1"                # 1 = depth image (0 = laser scan, 2 = both)
    # With Grid/3D true, Grid/MaxObstacleHeight (below) also clips /rtabmap/cloud_map: the viewer's 3D map lacks everything
    # higher than about 1 m above base_link (upper walls, trees) until the owner decides. Measured: cloud z max 0.96 m, 1.42 m with it disabled.
    Grid/3D: "true"                 # keep the 3D local maps: /rtabmap/cloud_map is a coloured 3D cloud (false = flat z=0)
    Grid/CellSize: "0.05"
    Grid/RangeMin: "0.3"
    Grid/RangeMax: "5.0"            # shorter than Vis/MaxDepth: far DA3 depth smears obstacles
    Grid/RayTracing: "true"         # clear free space between camera and obstacles
    Grid/MaxObstacleHeight: "1.0"   # m above base_link; ignore overhangs (tune to robot height). Also clips cloud_map at ~1 m (see Grid/3D)
