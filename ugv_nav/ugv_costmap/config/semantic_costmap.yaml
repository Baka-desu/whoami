# Dev 3 semantic costmap node (ugv_costmap). Grid extent and resolution are Dev 3 tuning, not robot facts.
semantic_costmap:
  ros__parameters:
    robot_frame: base_link           # grid frame; base_link sits on the ground plane (z = 0)
    camera_info_topic: /camera/camera_info   # the driver's (Dev 5) CameraInfo; must match the mask frame and size
    output_topic: /semantic_costmap/grid
    resolution: 0.1                  # m/cell, same as the Nav2 costmaps
    max_range: 6.0                   # m ahead of the camera projected into the grid
    half_width: 4.0                  # m either side
    # costmap_core projects pixel by pixel; 640x480 / 4 = 160x120 keeps up with the mask rate.
    # Pooling keeps the core's precedence (hazard > unknown > traversable) inside each 4x4 block.
    mask_downsample: 4
    # Observed class 0 (unknown) -> OccupancyGrid value. Never free (architecture §8.1); 50 -> Nav2 cost ~127.
    unknown_occupancy: 50
    # Mask stamp older than this (or no mask for this long) -> field of view published lethal (§8.4, §8.6).
    # Same as Dev 1 perception_max_age.
    max_mask_age_s: 0.5
