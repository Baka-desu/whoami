# TEST FIXTURE ONLY — NOT the product costmap configuration (that is Dev 3's).
#
# Closed-loop harness costmaps: both costmaps read the synthetic scenario map from
# /test/scenario_map through Nav2's StaticLayer (the bridge proposed to Dev 3 for
# feeding their OccupancyGrid into Nav2), plus an inflation layer. OccupancyGrid
# 100 -> lethal, -1 -> NO_INFORMATION (track_unknown_space), 1..99 scaled.
# inflate_around_unknown is the recommended Dev 3 setting (see README).
# robot_radius / inflation values are test values, not claims about the robot.
global_costmap:
  global_costmap:
    ros__parameters:
      global_frame: map
      robot_base_frame: base_link
      robot_radius: 0.2
      resolution: 0.05
      rolling_window: false
      track_unknown_space: true
      update_frequency: 5.0
      publish_frequency: 2.0
      plugins: ["static_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_topic: /test/scenario_map
        map_subscribe_transient_local: true
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        # >= half the robot's cross-section (Smac2D requirement); scaling = RPP's
        # inflation_cost_scaling_factor.
        inflation_radius: 0.55
        cost_scaling_factor: 3.0
        # Unknown = "never free — inflate" (arch §8.1): inflate around unknown cells like
        # lethal ones, otherwise paths hug unknown space, the robot's centre can end up
        # in it and Smac2D (allow_unknown: false) aborts with "Start occupied".
        inflate_around_unknown: true
local_costmap:
  local_costmap:
    ros__parameters:
      global_frame: odom
      robot_base_frame: base_link
      robot_radius: 0.2
      resolution: 0.05
      rolling_window: true
      width: 3
      height: 3
      track_unknown_space: true
      update_frequency: 10.0
      publish_frequency: 5.0
      plugins: ["static_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_topic: /test/scenario_map
        map_subscribe_transient_local: true
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.55
        cost_scaling_factor: 3.0
        # Unknown = "never free — inflate" (arch §8.1): inflate around unknown cells like
        # lethal ones, otherwise paths hug unknown space, the robot's centre can end up
        # in it and Smac2D (allow_unknown: false) aborts with "Start occupied".
        inflate_around_unknown: true
