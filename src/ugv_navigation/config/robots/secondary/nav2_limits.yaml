# Dev 4 per-robot overlay — "secondary" robot (architecture §13 item 9: second footprint /
# robot). Select with:  ros2 launch ugv_navigation navigation.launch.py robot:=secondary
#
# Overrides exactly the [ROBOT LIMIT] keys of controller_server.yaml and
# behavior_server.yaml. Loaded after the Dev 4 defaults and Dev 3's costmap params.
#
# PLACEHOLDER VALUES — identical to the Dev 4 defaults until Dev 5 publishes this
# platform's real speed / acceleration limits. Do not tune them here without those.
# The footprint for this robot is Dev 3 / Dev 5's (costmap params), not this file.
controller_server:
  ros__parameters:
    FollowPath:
      max_linear_vel: 0.4                  # m/s
      max_angular_vel: 0.8                 # rad/s
      min_angular_vel: -0.8                # rad/s (= -max_angular_vel)
      max_linear_accel: 0.5                # m/s^2
      max_linear_decel: -1.0               # m/s^2 (negative)
      max_angular_accel: 2.0               # rad/s^2
      max_angular_decel: -2.0              # rad/s^2 (negative)
      rotate_to_heading_angular_vel: 0.8   # rad/s (<= max_angular_vel)
      cancel_deceleration: 1.0             # m/s^2
behavior_server:
  ros__parameters:
    max_rotational_vel: 0.8                # rad/s
    min_rotational_vel: 0.3                # rad/s
    rotational_acc_lim: 2.0                # rad/s^2
