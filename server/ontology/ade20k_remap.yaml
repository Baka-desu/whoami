# Adapter remap: nvidia/segformer-b2-finetuned-ade-512-512 (150 ADE20K classes) -> the
# canonical 3-class Perception Port (architecture.md §8.1/§8.2).
#
# This is a STAND-IN adapter, not the RUGD SegFormer dev.md specifies (no pretrained RUGD
# checkpoint exists publicly; training one is a separate, much larger task - see PR discussion).
# It gives real per-pixel CV output today via a generic scene-segmentation model, remapped the
# same way any adapter must be: every raw label maps to exactly one of {0,1,2}, no raw score
# reaches the port (architecture.md §8.3).
#
# Rule used here: only unambiguous ground surfaces are traversable. sky/ceiling carry no ground
# information at all, so they are unknown (inflate, never free). Every other identifiable object
# (building, vegetation other than grass, vehicle, person, terrain feature, furniture, pole,
# fence, water, machinery, stairs, ...) is hazard: for a wheeled ground rover, "confidently not
# ground" means "do not drive there", which is what hazard (lethal) encodes. This is deliberately
# conservative - see architecture.md's own rule that unknown/hazard both block the path, while
# traversable is the one claim that has to be trustworthy.

traversable: # -> canonical class 1
  - floor
  - road
  - grass
  - sidewalk
  - earth
  - field
  - sand
  - path
  - dirt track
  - land
  - runway
  - rug

unknown: # -> canonical class 0 (no ground information in this label)
  - sky
  - ceiling

# default: every ADE20K label not listed above -> canonical class 2 (hazard).
default: hazard
